<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13294b" />
    <title>Contact · Free Food @ UIUC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="border-b-4 border-brand-accent bg-brand text-on-brand">
      <div class="mx-auto max-w-content px-4 pt-7 pb-2">
        <p class="font-display text-2xl leading-tight font-extrabold"><a href="./">Free Food <span class="text-brand-accent">@ UIUC</span></a></p>
        <p class="mt-1 text-on-brand-muted">Contact</p>
        <nav id="site-nav" aria-label="Main" class="mt-3 flex gap-5 font-display text-sm font-semibold"></nav>
      </div>
    </header>
    <main class="mx-auto max-w-content px-4">
      <h1 class="mt-8 font-display text-xl leading-tight font-bold">Get in touch</h1>
      <p class="mt-2">Found an event that's missing, a listing that's wrong, or something that doesn't work? Have an idea for the site? Send an email.</p>
      <p class="mt-4 text-lg font-semibold">
        <a data-contact-email class="underline decoration-line underline-offset-3 hover:decoration-current" href="./contact.html">Email address loading…</a>
      </p>
      <p class="mt-4 text-muted">For a missing event, include the club name, the event, and a link if you have one.</p>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
