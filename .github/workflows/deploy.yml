# Fetches today's free-food events and publishes the site to GitHub Pages.
name: Fetch events and deploy

on:
  schedule:
    # Times are UTC: 7am, 11am, 3pm, and 7pm in Champaign during daylight time (an hour earlier in winter).
    - cron: "0 12,16,20,0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails only if every source is down, which keeps the last published list instead of an empty one.
      - run: npm run fetch-events
        env:
          # The live copy holds today's events that have since ended and dropped out of the feed.
          PREVIOUS_EVENTS_URL: https://kabirg1.github.io/free-food-at-uiuc/events.json
      # A free Supabase project pauses after a week with no activity; one tiny query per run keeps it awake.
      # Skipped (without failing the deploy) until the Supabase settings are added to the repository.
      - name: Keep Supabase awake
        if: ${{ vars.SUPABASE_URL != '' }}
        run: >
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keep_awake"
          -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{}'
          || echo "::warning::Couldn't reach Supabase"
      - run: npm run build
        env:
          # Public values, stored as repository variables (Settings, Secrets and variables, Actions, Variables).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
