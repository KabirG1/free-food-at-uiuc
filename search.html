<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13294b" />
    <title>Search · Free Food @ UIUC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="border-b-4 border-brand-accent bg-brand text-on-brand">
      <div class="mx-auto max-w-page px-4 lg:px-8 pt-7 pb-2">
        <p class="font-display text-2xl leading-tight font-extrabold"><a href="./">Free Food <span class="text-brand-accent">@ UIUC</span></a></p>
        <p class="mt-1 text-on-brand-muted">Search free food from today through next month</p>
        <nav id="site-nav" aria-label="Main" class="mt-3 flex gap-5 font-display text-sm font-semibold"></nav>
      </div>
    </header>
    <main class="mx-auto max-w-page px-4 lg:px-8">
      <div id="search-box" class="mt-8 max-w-prose"></div>
      <div id="content" aria-live="polite">
        <p class="mt-8 text-muted">Loading events…</p>
      </div>
    </main>
    <p id="updated" class="mx-auto max-w-page px-4 lg:px-8 pt-8 text-sm text-muted"></p>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/searchPage.ts"></script>
  </body>
</html>
